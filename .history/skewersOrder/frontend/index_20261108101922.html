<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espetinhos do Chefe</title>
  <!-- Aqui conectamos o arquivo de estilos -->
  <link rel="stylesheet" href="style.css?">
</head>

<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo-titulo">Espetinhos do Chefe</div>

    <!-- Novo Botão Flutuante do WhatsApp com Ícone Fixo -->
    <a href="https://wa.me/5581992199044" target="_blank" class="zap-topo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="white" width="30" height="30">
        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157.1zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
      </svg>
    </a>
  </header>

  <!-- Área de Iniciar Pedido -->
  <div class="area-iniciar">
    <button class="btn-iniciar" onclick="abrirModalCadastro()">
      INICIAR PEDIDO
    </button>
  </div>

  <!-- Lista de Comidas -->
  <div class="secao-produtos">
    <h2 class="titulo-carnes">Carnes e Acompanhamentos</h2>
    <div id="lista-carnes"></div> <!-- A MUDANÇA FOI FEITA AQUI -->
  </div>

  <!-- Lista de Bebidas -->
  <div class="secao-produtos">
    <h2 class="titulo-bebidas">Bebidas</h2>
    <div id="lista-bebidas"></div>
  </div>

  <!-- Área de Encerrar Pedido -->
  <div class="container-botoes-finais">
  <button class="btn-metade btn-limpar-metade" onclick="limparCarrinho()">
    🗑️ Limpar
  </button>
  
  <button class="btn-metade btn-encerrar-metade" onclick="abrirResumo()">
    ENCERRAR PEDIDO
  </button>
</div>

    <div class="msg-agradecimento">Agradecemos a Preferência</div>


  <!-- Rodapé -->
  <footer class="rodape-fixo">
    <button class="btn-gerenciar" onclick="abrirModalAdmin()">
      ⚙️ Gerenciar
    </button>



  </footer>
  <!-- MODAL 1: Cadastro do Cliente -->
  <div id="modalCadastro" class="modal">
    <div class="modal-conteudo">
      <h3>Identificação</h3>

      <div class="form-group">
        <label>Nome:</label>
        <input type="text" id="cli-nome" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label>Telefone:</label>
        <input type="tel" id="cli-telefone" placeholder="(81) 90000-0000">
      </div>

      <div class="form-group">
        <label>Retirada ou Entrega?</label>
        <select id="cli-tipo" onchange="verificarEntrega()">
          <option value="retirar">Vou retirar no local</option>
          <option value="entregar">Quero entrega (Terá taxa)</option>
        </select>
      </div>

      <div class="form-group" id="div-endereco" style="display:none;">
        <label>Endereço Completo:</label>
        <input type="text" id="cli-endereco" placeholder="Rua, Número, Bairro">
      </div>

      <!-- NOVA ÁREA DE BOTÕES -->
      <div class="caixa-botoes-modal">
        <button type="button" class="btn-acao" onclick="fecharModalCadastro()"
          style="flex: 1; background-color: #666666; margin-top: 0;">
          Voltar
        </button>

        <button type="button" class="btn-acao" onclick="salvarCadastro()" style="flex: 1; margin-top: 0;">
          Confirmar
        </button>
      </div>

    </div> <!-- Fecha a modal-conteudo -->
  </div> <!-- Fecha a modalCadastro -->

  <!-- MODAL 2: Resumo do Pedido -->
  <div id="modalResumo" class="modal">
    <div class="modal-conteudo">
      <h3>Resumo do Pedido</h3>
      <div id="conteudo-resumo" style="font-size: 14px; margin-bottom: 20px;">
      </div>

      <!-- INÍCIO DAS NOVAS OPÇÕES DE FAROFA, VINAGRETE E OBS -->

      <!-- Opção de Farofa -->
      <div class="form-group">
        <label>Incluir Farofa?</label>
        <div style="display: flex; gap: 15px; margin-top: 5px;">
          <label><input type="radio" name="farofa" value="Sim" checked> Sim</label>
          <label><input type="radio" name="farofa" value="Não"> Não</label>
        </div>
      </div>

      <!-- Opção de Vinagrete -->
      <div class="form-group">
        <label>Incluir Vinagrete?</label>
        <div style="display: flex; gap: 15px; margin-top: 5px;">
          <label><input type="radio" name="vinagrete" value="Sim" checked> Sim</label>
          <label><input type="radio" name="vinagrete" value="Não"> Não</label>
        </div>
      </div>

      <!-- Campo de Observações -->
      <div class="form-group">
        <label>Observações do Pedido:</label>
        <textarea id="obs-pedido" rows="3" maxlength="120" placeholder="Ex: Bem passado, deixar na portaria..."
          style="width: 100%; border-radius: 5px; padding: 8px;"></textarea>
        <div id="contador-obs">0/120 caracteres</div>
      </div>

      <!-- FIM DAS NOVAS OPÇÕES -->

      <h3 id="valor-total">Total: R$ 0,00</h3>
      <button class="btn-acao btn-whatsapp" onclick="enviarPedidoWhatsApp()">
        Enviar Pedido (WhatsApp)
      </button>
      <button class="btn-acao btn-fechar" onclick="fecharModal('modalResumo')" style="margin-bottom: 110px;">
        Voltar e Escolher Mais
      </button>
    </div>
  </div>

  <!-- MODAL 3: Login Admin (Gerenciar) -->
  <div id="modalAdmin" class="modal">
    <div class="modal-conteudo">
      <h3>Área Restrita (Gerenciar)</h3>
      <div class="form-group">
        <label>Usuário:</label>
        <input type="text" id="admin-user">
      </div>
      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="admin-pass">
      </div>
      <button type="button" class="btn-acao" onclick="loginAdmin(event)">Entrar</button>
      <button type="button" class="btn-acao btn-fechar" onclick="fecharModal('modalAdmin')">
        Cancelar
      </button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- PAINEL DE ADMINISTRAÇÃO (Oculto por padrão)-->
  <!-- ========================================== -->
  <div id="painel-admin" style="display: none; padding: 20px; min-height: 100vh;">
    <div
      style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid white; padding-bottom: 10px; margin-bottom: 20px;">
      <h2 style="color: white; margin: 0;">⚙️ Gestão do Cardápio</h2>
      <button class="btn-acao btn-fechar" onclick="fecharPainelAdmin()" style="width: auto; padding: 10px 20px;">
        Sair
      </button>
    </div>

    <p style="color: #ccc;">Clique no botão para Ativar ou Desativar os produtos na loja.</p>

    <!-- Aqui o JavaScript vai injetar a lista completa de produtos -->
    <div id="lista-admin"></div>
  </div>

  <!-- Aqui conectamos o arquivo de lógica e ações -->
  <script src="script.js"></script>
</body>

</html>
